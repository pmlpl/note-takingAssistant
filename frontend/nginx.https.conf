# ==============================================================
#  模式 B：HTTPS (443) + HTTP 强制跳转
#  用途：证书申请成功后，entrypoint.sh 会切换到此配置。
#  - 80 端口：只负责 Let's Encrypt 域名验证 + 301 跳 HTTPS
#  - 443 端口：真正服务前端 + API，并启用 TLS/安全头/gzip
# ==============================================================

# --- 80 端口：全部 301 跳转到 HTTPS ---
server {
    listen 80;
    server_name momo.makeup www.momo.makeup;

    # Let's Encrypt 域名验证（续期时必须能访问到）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他请求 301 永久重定向到 HTTPS（保留路径与 query）
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 443 端口：真正服务页面 ---
server {
    listen 443 ssl http2;
    server_name momo.makeup www.momo.makeup;

    # ====== Let's Encrypt 证书（certbot 自动管理）======
    ssl_certificate     /etc/letsencrypt/live/momo.makeup/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/momo.makeup/privkey.pem;

    # ====== SSL 安全配置（只开现代协议）======
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ====== 安全响应头 ======
    # HSTS：告诉浏览器一年之内只走 HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 禁止浏览器自动嗅探 MIME（防 XSS 变体）
    add_header X-Content-Type-Options nosniff;
    # 禁止被嵌入 iframe（防点击劫持）
    add_header X-Frame-Options SAMEORIGIN;
    # 引用策略（防止敏感路径泄露）
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ====== gzip 静态资源压缩（首屏提速 50%+）======
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript application/xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # ====== 前端静态资源 ======
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ====== API 代理 ======
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1200s;
    }

    # ====== 上传文件 ======
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
