# Release Workflow：推送 v*.*.* tag 时自动构建 Docker 镜像并发布到 GitHub Container Registry (GHCR)
#
# 触发方式：
#   git tag v1.2.0
#   git push origin v1.2.0
#
# 发布产物：
#   - ghcr.io/<owner>/note-taking-assistant/backend:v1.2.0
#   - ghcr.io/<owner>/note-taking-assistant/backend:latest
#   - ghcr.io/<owner>/note-taking-assistant/frontend:v1.2.0
#   - ghcr.io/<owner>/note-taking-assistant/frontend:latest
#
# 同时创建 GitHub Release，附带 CHANGELOG 摘要。

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write       # 创建 GitHub Release
  packages: write       # 推送镜像到 GHCR

env:
  REGISTRY: ghcr.io
  # 镜像名前缀（小写，GHCR 要求）
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ========== 构建并发布后端镜像 ==========
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 提取 tag 版本号
        id: meta
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "image_tag=${TAG#v}" >> $GITHUB_OUTPUT

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像名（小写）
        id: image
        run: |
          REPO_LOWERCASE=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend_image=${{ env.REGISTRY }}/${REPO_LOWERCASE}/backend" >> $GITHUB_OUTPUT

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.image.outputs.backend_image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.image.outputs.backend_image }}:latest
          labels: |
            org.opencontainers.image.title=NoteMind Backend
            org.opencontainers.image.version=${{ steps.meta.outputs.image_tag }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}

  # ========== 构建并发布前端镜像 ==========
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖并构建前端
        working-directory: frontend
        env:
          # 生产构建：API 基址留空，前端走相对路径，由 Nginx 反代到后端
          VITE_API_BASE_URL: ''
        run: |
          npm ci
          npm run build

      - name: 提取 tag 版本号
        id: meta
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "image_tag=${TAG#v}" >> $GITHUB_OUTPUT

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像名（小写）
        id: image
        run: |
          REPO_LOWERCASE=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "frontend_image=${{ env.REGISTRY }}/${REPO_LOWERCASE}/frontend" >> $GITHUB_OUTPUT

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.image.outputs.frontend_image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.image.outputs.frontend_image }}:latest
          labels: |
            org.opencontainers.image.title=NoteMind Frontend
            org.opencontainers.image.version=${{ steps.meta.outputs.image_tag }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}

  # ========== 创建 GitHub Release ==========
  create-release:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 拉取完整历史，用于读取 CHANGELOG

      - name: 提取版本号
        id: meta
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "image_tag=${TAG#v}" >> $GITHUB_OUTPUT

      - name: 提取本版本 CHANGELOG 段落
        id: changelog
        run: |
          # 从 CHANGELOG.md 中截取当前版本的段落（## [vX.Y.Z] 到下一个 ## 之间）
          if [ -f CHANGELOG.md ]; then
            SECTION=$(awk -v ver="${{ steps.meta.outputs.tag }}" '
              /^## \[/ { in_section=($0 ~ "\\[" ver "\\]"); next }
              in_section && /^## \[/ { in_section=0 }
              in_section { print }
            ' CHANGELOG.md)
            if [ -z "$SECTION" ]; then
              SECTION="发布说明详见提交历史。"
            fi
          else
            SECTION="CHANGELOG.md 不存在，详见提交历史。"
          fi
          # 多行变量写入 GITHUB_OUTPUT
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$SECTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 提取镜像名（用于 Release notes）
        id: image
        run: |
          REPO_LOWERCASE=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "registry=${{ env.REGISTRY }}/${REPO_LOWERCASE}" >> $GITHUB_OUTPUT

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Release ${{ steps.meta.outputs.tag }}
          body: |
            ## 📦 Docker 镜像

            本次发布已构建并推送以下镜像到 GitHub Container Registry：

            ```
            # 后端
            docker pull ${{ steps.image.outputs.registry }}/backend:${{ steps.meta.outputs.image_tag }}
            docker pull ${{ steps.image.outputs.registry }}/backend:latest

            # 前端
            docker pull ${{ steps.image.outputs.registry }}/frontend:${{ steps.meta.outputs.image_tag }}
            docker pull ${{ steps.image.outputs.registry }}/frontend:latest
            ```

            ## 📝 更新日志

            ${{ steps.changelog.outputs.body }}

            ## 🚀 部署方式

            ```bash
            # 1. 拉取镜像
            docker pull ${{ steps.image.outputs.registry }}/backend:${{ steps.meta.outputs.image_tag }}
            docker pull ${{ steps.image.outputs.registry }}/frontend:${{ steps.meta.outputs.image_tag }}

            # 2. 在 docker-compose.yml 中将 image: 字段替换为上述镜像
            # 3. docker compose up -d
            ```
          draft: false
          prerelease: false