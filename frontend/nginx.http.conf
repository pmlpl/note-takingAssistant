# ==============================================================
#  模式 A：纯 HTTP (80 端口)
#  用途：第一次部署，证书还没申请好的时候用。
#  - 80 端口同时服务前端页面 + API 代理 + certbot 域名验证
# ==============================================================

server {
    listen 80;
    server_name momo.makeup www.momo.makeup;

    # --- certbot 域名验证路径（千万不要动这段）---
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- 前端静态资源 ---
    location / {
        root /var/www/note-app;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # --- API 代理（转发给后端容器）---
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1200s;
    }

    # --- 上传文件代理 ---
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript application/xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
}
