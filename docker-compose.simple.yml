# ==============================================================
#  NoteMind 一键部署 Docker Compose（简化版）
#  只对外开放一个端口，内部包含 MySQL + Redis + Backend + Frontend
#  启动命令：docker compose -f docker-compose.simple.yml --env-file .env up -d --build
# ==============================================================

services:
  # ========== MySQL 数据库 ==========
  mysql:
    image: mysql:8.0
    container_name: note-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-note_db}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========== Redis 缓存（带密码） ==========
  redis:
    image: redis:7-alpine
    container_name: note-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== FastAPI 后端 ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.simple
    container_name: note-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    environment:
      # 服务器配置
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      API_BASE_URL: "http://localhost:${EXTERNAL_PORT:-8080}"
      FRONTEND_URL: "http://localhost:${EXTERNAL_PORT:-8080}"
      CORS_ORIGINS: "http://localhost:${EXTERNAL_PORT:-8080},http://127.0.0.1:${EXTERNAL_PORT:-8080}"
      DEBUG: "false"
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-note_db}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # JWT 配置
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "120"
      # AI 配置（用户在个人中心配置 Key，此处留默认）
      LM_STUDIO_URL: "http://localhost:1234/v1"
      LM_STUDIO_MODEL: "your-model-id"
      OPENAI_API_KEY: ""
      LLM_HTTP_READ_TIMEOUT_SECONDS: "1200.0"
      LLM_HTTP_TRUST_ENV: "false"
      # SMTP 邮件服务
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-NoteMind}
      # GitHub OAuth 登录
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}

  # ========== Vue 前端 (Nginx) ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.simple
    container_name: note-frontend
    restart: always
    ports:
      - "${EXTERNAL_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  backend_uploads:
