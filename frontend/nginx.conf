# ======================================================================
#  说明：第一次部署先启动 HTTP (80)，等 certbot 申请好证书后，
#  由 entrypoint.sh 自动开启 HTTPS (443)。
# ======================================================================

# -------- 80 端口：HTTP --------
#  - /var/www/certbot/ 目录交给 certbot 做域名验证
#  - 其他请求如果有证书则 301 跳转到 HTTPS；没有证书则照常服务前端
server {
    listen 80;
    server_name momo.makeup www.momo.makeup;

    # Let's Encrypt 域名验证用（不要动这段）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 静态资源（前端 dist 目录）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 代理 API 请求到后端
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1200s;
    }

    # 上传文件
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

