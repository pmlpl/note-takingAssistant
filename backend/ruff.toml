# Ruff 配置：现代 Python linter + formatter
# 文档：https://docs.astral.sh/ruff/configuration/

target-version = "py310"
line-length = 120

[lint]
# 启用的规则集：
# E  - pycodestyle errors
# W  - pycodestyle warnings
# F  - pyflakes (未使用变量、导入等)
# I  - isort (import 排序)
# B  - flake8-bugbear (常见陷阱)
# UP - pyupgrade (现代化语法)
# N  - pep8-naming (命名规范)
select = ["E", "W", "F", "I", "B", "UP", "N"]

# 忽略的规则（项目实际情况）
ignore = [
    "E501",   # 行长度由 formatter 控制，不强制
    "B008",   # FastAPI Depends() 在默认参数中是正常用法
    "B904",   # raise from 在某些场景下冗余
    "N805",   # Pydantic 模型方法第一个参数不强制 cls/self
    "N815",   # API 请求/响应模型字段有意使用 camelCase（前端契约，配合 alias）
    "N818",   # 异常类名不强制 Error 后缀
    "UP007",  # 兼容 Python 3.9，暂不强制 X | None 语法
    "UP045",  # 同上，Optional[X] 不强制改 X | None
]

[lint.per-file-ignores]
# 测试文件允许一些宽松
"tests/**" = ["F401", "F841"]
# 迁移脚本不强制
"migrations/**" = ["E402", "F401"]
"alembic/versions/**" = ["E402", "F401"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"