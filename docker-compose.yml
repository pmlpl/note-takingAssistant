version: "3.8"

services:
  # ========== MySQL 数据库 ==========
  mysql:
    image: mysql:8.0
    container_name: note-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-note_db}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========== Redis 缓存（带密码） ==========
  redis:
    image: redis:7-alpine
    container_name: note-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== FastAPI 后端（多 worker）==========
  backend:
    build: ./backend
    container_name: note-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 服务器配置
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      API_BASE_URL: "https://momo.makeup"
      # 前端地址（CORS 用）
      FRONTEND_URL: "https://momo.makeup"
      DEBUG: "false"
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-note_db}
      # Redis 配置（带密码）
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # JWT 配置（务必修改 SECRET_KEY！）
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "120"
      # AI 默认配置（用户可在个人中心覆盖）
      LM_STUDIO_URL: "http://localhost:1234/v1"
      LM_STUDIO_MODEL: "your-model-id"
      OPENAI_API_KEY: ""
      LLM_HTTP_READ_TIMEOUT_SECONDS: "1200.0"
      LLM_HTTP_TRUST_ENV: "false"

  # ========== Vue 前端 (Nginx + HTTPS) ==========
  frontend:
    build: ./frontend
    container_name: note-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 证书目录（certbot 将证书放在这里，Nginx 读取）
      - certbot_conf:/etc/letsencrypt
      # 让 Nginx 能读取 certbot 的 challenge 文件
      - certbot_www:/var/www/certbot
    depends_on:
      - backend

  # ========== Certbot（自动申请 & 续期 Let's Encrypt 免费证书）==========
  certbot:
    image: certbot/certbot:latest
    container_name: note-certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # 首次部署需要手动执行一次申请命令（下面会告诉你）
    # 证书到期前自动续期由容器内置 cron 完成
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  mysql_data:
  redis_data:
  certbot_conf:
  certbot_www:
